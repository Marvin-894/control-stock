<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIM - Librería Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-magenta: #e91e63;
      --brand-cyan: #00bcd4;
      --brand-yellow: #fbc02d;
      --brand-orange: #ff9800;
      --bg-gradient: linear-gradient(135deg, #e0f7fa 0%, #fff3e0 50%, #fce4ec 100%);
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: #2c3e50;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 550px;
    }

    /* ENCABEZADO DE MARCA */
    .brand-header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 16px 20px;
      margin-bottom: 16px;
      border: 3px solid #ffffff;
      box-shadow: var(--card-shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .brand-logo-area {
      display: flex;
      flex-direction: column;
    }

    .logo-main {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(45deg, var(--brand-magenta), var(--brand-orange), var(--brand-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .tagline-ribbon {
      background: var(--brand-cyan);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 12px;
      margin-top: 4px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0, 188, 212, 0.3);
    }

    #sync-status {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sync-ok { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .sync-saving { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
    .sync-error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }

    /* PANEL DE CONTROL BÚSQUEDA Y MÉTICUS */
    .control-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--card-shadow);
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      border: 2px solid #b2ebf2;
      border-radius: 16px;
      outline: none;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--brand-cyan);
      box-shadow: 0 0 0 4px rgba(0, 188, 212, 0.15);
    }

    .action-bar {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      flex: 1;
      padding: 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.85rem;
      border: 2px solid var(--brand-cyan);
      background: white;
      color: var(--brand-cyan);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, var(--brand-magenta), var(--brand-orange));
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 10px rgba(233, 30, 99, 0.25);
    }

    /* TARJETAS DE PRODUCTO CON ESTILO ESCOLAR/CREATIVO */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--card-shadow);
      border-left: 6px solid var(--brand-cyan);
      position: relative;
    }

    .product-card.low-stock {
      border-left-color: var(--brand-magenta);
      background: #fff8f9;
    }

    .card-info {
      flex-grow: 1;
      padding-right: 10px;
    }

    .card-category {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #90a4ae;
    }

    .card-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      color: #37474f;
      margin: 2px 0 6px 0;
    }

    .card-price {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--brand-magenta);
    }

    .card-controls {
      display: flex;
      align-items: center;
      background: #f1f8e9;
      border-radius: 14px;
      padding: 4px;
      border: 1px solid #dedede;
    }

    .btn-stock {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.2rem;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .btn-stock:active { transform: scale(0.9); }
    .btn-minus { background: var(--brand-magenta); }
    .btn-plus { background: #00c853; }

    .stock-count {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      min-width: 36px;
      text-align: center;
      color: #263238;
    }

    .stock-count.alert {
      color: var(--brand-magenta);
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ENCABEZADO JIM -->
  <header class="brand-header">
    <div class="brand-logo-area">
      <span class="logo-main">JIM</span>
      <span class="tagline-ribbon">Librería Online</span>
    </div>
    <div id="sync-status" class="sync-ok">● Sincronizado</div>
  </header>

  <!-- BÚSQUEDA Y FILTROS -->
  <div class="control-panel">
    <div class="search-wrapper">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar por nombre o lector..." autofocus>
    </div>
    <div class="action-bar">
      <button id="filter-btn" class="filter-btn" onclick="toggleFaltantes()">⭐ Reponer Faltantes</button>
    </div>
  </div>

  <!-- LISTA DE ARTÍCULOS -->
  <div id="product-list" class="product-list"></div>
</div>

<script>
  const CONFIG = {
    TOKEN: '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',
    OWNER: 'Marvin-894',
    REPO: 'control-stock',
    FILE: 'stock.json'
  };

  let productos = [];
  let fileSha = '';
  let soloFaltantes = false;

  const statusEl = document.getElementById('sync-status');
  const listEl = document.getElementById('product-list');
  const searchInput = document.getElementById('search-input');

  function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = type ? `sync-${type}` : '';
  }

  async function cargarStock() {
    setStatus('⌛ Sincronizando...', 'saving');
    const url = `https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/contents/${CONFIG.FILE}`;
    
    try {
      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${CONFIG.TOKEN}` }
      });
      if (!res.ok) throw new Error('Error de red');
      
      const data = await res.json();
      fileSha = data.sha;
      const decoded = decodeURIComponent(escape(atob(data.content)));
      productos = JSON.parse(decoded);
      
      setStatus('● Sincronizado', 'ok');
      render();
    } catch (err) {
      console.error(err);
      setStatus('⚠️ Sin conexión', 'error');
    }
  }

  async function guardarEnGitHub(skuModificado, cambio) {
    setStatus('⌛ Guardando...', 'saving');
    const url = `https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/contents/${CONFIG.FILE}`;
    
    try {
      const nuevoContenidoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(productos, null, 2))));
      
      const bodyData = {
        message: `Stock: ${skuModificado} (${cambio > 0 ? '+' : ''}${cambio})`,
        content: nuevoContenidoBase64,
        sha: fileSha
      };

      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${CONFIG.TOKEN}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(bodyData)
      });

      if (!res.ok) throw new Error('Error al guardar');
      
      const resData = await res.json();
      fileSha = resData.content.sha;
      setStatus('● Sincronizado', 'ok');
    } catch (err) {
      console.error(err);
      setStatus('⚠️ Error al guardar', 'error');
      cargarStock();
    }
  }

  function modificarStock(sku, delta) {
    const prod = productos.find(p => p.sku === sku);
    if (prod) {
      prod.stock += delta;
      if (prod.stock < 0) prod.stock = 0;
      render();
      guardarEnGitHub(sku, delta);
    }
  }

  function toggleFaltantes() {
    soloFaltantes = !soloFaltantes;
    const btn = document.getElementById('filter-btn');
    btn.classList.toggle('active', soloFaltantes);
    btn.textContent = soloFaltantes ? 'Mostrando Faltantes (Ver Todos)' : '⭐ Reponer Faltantes';
    render();
  }

  function render() {
    const query = searchInput.value.toLowerCase().trim();
    listEl.innerHTML = '';

    const filtrados = productos.filter(p => {
      const coincideBusqueda = p.nombre.toLowerCase().includes(query) || p.sku.toLowerCase().includes(query);
      const coincideFaltante = soloFaltantes ? p.stock <= p.minimo : true;
      return coincideBusqueda && coincideFaltante;
    });

    filtrados.forEach(p => {
      const esCritico = p.stock <= p.minimo;
      const card = document.createElement('div');
      card.className = `product-card ${esCritico ? 'low-stock' : ''}`;
      
      card.innerHTML = `
        <div class="card-info">
          <div class="card-category">${p.categoria} | SKU: ${p.sku}</div>
          <div class="card-title">${p.nombre}</div>
          <div class="card-price">$${p.precio.toLocaleString('es-AR')}</div>
        </div>
        <div class="card-controls">
          <button class="btn-stock btn-minus" onclick="modificarStock('${p.sku}', -1)">-</button>
          <span class="stock-count ${esCritico ? 'alert' : ''}">${p.stock}</span>
          <button class="btn-stock btn-plus" onclick="modificarStock('${p.sku}', 1)">+</button>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  searchInput.addEventListener('input', render);
  cargarStock();
</script>

</body>
</html>
