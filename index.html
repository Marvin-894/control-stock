<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Stock</title>
  <style>
    /* Estilos del modal y botones de control */
    .header-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .btn-action {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      background-color: #2c3e50;
      color: white;
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: #34495e;
    }

    .btn-add {
      background-color: #27ae60;
    }

    .btn-add:hover {
      background-color: #219150;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .modal-content h3 {
      margin-top: 0;
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-cancel {
      background-color: #7f8c8d;
    }

    .sync-ok { color: #27ae60; font-weight: bold; }
    .sync-saving { color: #e67e22; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header-actions">
    <button class="btn-action btn-add" onclick="abrirModalNuevoProducto()">➕ Nuevo Producto</button>
    <button id="filter-btn" class="btn-action" onclick="toggleFaltantes()">⭐ Reponer Faltantes</button>
  </div>

  <div id="sync-status"></div>
  <input type="text" id="search-input" placeholder="Buscar por SKU o Nombre..." style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box;" />
  <div id="product-list"></div>

  <div id="product-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>➕ Agregar Nuevo Producto</h3>
      <form id="add-product-form" onsubmit="guardarNuevoProducto(event)">
        <div class="form-group">
          <label for="new-sku">SKU / Código de Barras *</label>
          <input type="text" id="new-sku" required />
        </div>
        <div class="form-group">
          <label for="new-nombre">Nombre del Producto *</label>
          <input type="text" id="new-nombre" required />
        </div>
        <div class="form-group">
          <label for="new-categoria">Categoría</label>
          <input type="text" id="new-categoria" placeholder="Librería" />
        </div>
        
        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label for="new-costo">Costo Mayorista ($)</label>
            <input type="number" id="new-costo" step="0.01" min="0" value="0" />
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="new-precio">Precio Venta ($) *</label>
            <input type="number" id="new-precio" step="0.01" min="0" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex: 1;">
            <label for="new-stock">Stock Inicial *</label>
            <input type="number" id="new-stock" min="0" value="0" required />
          </div>
          <div class="form-group" style="flex: 1;">
            <label for="new-minimo">Stock Mínimo</label>
            <input type="number" id="new-minimo" min="0" value="5" />
          </div>
        </div>
