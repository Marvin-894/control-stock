<script>
  const CONFIG = {
    TOKEN: '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',
    OWNER: 'Marvin-894',
    REPO: 'control-stock',
    FILE: 'stock.json'
  };

  let productos = [];
  let fileSha = '';
  let soloFaltantes = false;
  let guardando = false;

  const statusEl = document.getElementById('sync-status');
  const listEl = document.getElementById('product-list');
  const searchInput = document.getElementById('search-input');

  function setStatus(text, type) {
    if (!statusEl) return;
    statusEl.textContent = text;
    statusEl.className = type ? `sync-${type}` : '';
  }

  async function cargarStock() {
    if (guardando) return; // Evita sobreescribir mientras se guarda un cambio
    setStatus('⌛ Sincronizando...', 'saving');
    const url = `https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/contents/${CONFIG.FILE}`;
    
    try {
      const res = await fetch(url, {
        headers: { 
          'Authorization': `Bearer ${CONFIG.TOKEN}`,
          'Cache-Control': 'no-cache'
        }
      });
      if (!res.ok) throw new Error('Error al conectar con GitHub');
      
      const data = await res.json();
      fileSha = data.sha;
      
      // Decodificación UTF-8 segura para acentos y caracteres especiales
      const decodedContent = decodeURIComponent(escape(atob(data.content)));
      productos = JSON.parse(decodedContent);
      
      setStatus('● Sincronizado', 'ok');
      render();
    } catch (err) {
      console.error(err);
      setStatus('⚠️ Sin conexión', 'error');
    }
  }

  async function guardarEnGitHub(skuModificado, accionLog) {
    guardando = true;
    setStatus('⌛ Guardando...', 'saving');
    const url = `https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/contents/${CONFIG.FILE}`;
    
    try {
      const jsonString = JSON.stringify(productos, null, 2);
      const nuevoContenidoBase64 = btoa(unescape(encodeURIComponent(jsonString)));
      
      const bodyData = {
        message: `Actualización SKU ${skuModificado}: ${accionLog}`,
        content: nuevoContenidoBase64,
        sha: fileSha
      };

      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${CONFIG.TOKEN}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(bodyData)
      });

      if (!res.ok) throw new Error('Error al guardar en GitHub');
      
      const resData = await res.json();
      fileSha = resData.content.sha; // Actualiza el SHA para el próximo guardado
      setStatus('● Sincronizado', 'ok');
    } catch (err) {
      console.error(err);
      setStatus('⚠️ Error al guardar', 'error');
    } finally {
      guardando = false;
    }
  }

  function modificarStock(sku, delta) {
    const prod = productos.find(p => String(p.sku) === String(sku));
    if (prod) {
      const nuevoStock = (Number(prod.stock) || 0) + delta;
      prod.stock = nuevoStock < 0 ? 0 : nuevoStock;
      
      render(); // Actualiza la pantalla inmediatamente
      guardarEnGitHub(sku, `Stock ajustado a ${prod.stock}`);
    }
  }

  function modificarPrecioVenta(sku, nuevoPrecioStr) {
    const nuevoPrecio = parseFloat(nuevoPrecioStr.replace(',', '.'));
    if (isNaN(nuevoPrecio) || nuevoPrecio < 0) return;

    const prod = productos.find(p => String(p.sku) === String(sku));
    if (prod && prod.precio !== nuevoPrecio) {
      prod.precio = nuevoPrecio;
      render();
      guardarEnGitHub(sku, `Precio de venta actualizado a $${nuevoPrecio}`);
    }
  }

  function toggleFaltantes() {
    soloFaltantes = !soloFaltantes;
    const btn = document.getElementById('filter-btn');
    if (btn) {
      btn.classList.toggle('active', soloFaltantes);
      btn.textContent = soloFaltantes ? 'Mostrando Faltantes (Ver Todos)' : '⭐ Reponer Faltantes';
    }
    render();
  }

  function render() {
    const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
    listEl.innerHTML = '';

    const filtrados = productos.filter(p => {
      const nombre = (p.nombre || '').toLowerCase();
      const sku = String(p.sku || '').toLowerCase();
      const coincideBusqueda = nombre.includes(query) || sku.includes(query);
      
      const limiteMinimo = p.minimo !== undefined ? Number(p.minimo) : 5;
      const esFaltante = (Number(p.stock) || 0) <= limiteMinimo;
      
      const coincideFaltante = soloFaltantes ? esFaltante : true;
      return coincideBusqueda && coincideFaltante;
    });

    if (filtrados.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; padding: 20px; color: #78909c; font-weight: 600;">No se encontraron productos ${soloFaltantes ? 'para reponer' : ''}.</div>`;
      return;
    }

    filtrados.forEach(p => {
      const stockActual = Number(p.stock) || 0;
      const limiteMinimo = p.minimo !== undefined ? Number(p.minimo) : 5;
      const esCritico = stockActual <= limiteMinimo;

      const costoMayorista = p.costo !== undefined ? Number(p.costo) : 0;
      const precioUnitario = p.precioUnitario !== undefined ? Number(p.precioUnitario) : 0;
      const precioVenta = Number(p.precio) || 0;

      const card = document.createElement('div');
      card.className = `product-card ${esCritico ? 'low-stock' : ''}`;
      
      card.innerHTML = `
        <div class="card-info">
          <div class="card-category">${p.categoria || 'Librería'} | SKU: ${p.sku}</div>
          <div class="card-title">${p.nombre}</div>
          
          <div class="price-details" style="font-size: 0.82rem; color: #555; margin-top: 4px;">
            <span><strong>Costo Mayorista:</strong> $${costoMayorista.toLocaleString('es-AR')}</span>
            ${precioUnitario > 0 ? `<span style="margin-left: 8px;">| <strong>Unitario:</strong> $${precioUnitario.toLocaleString('es-AR')}</span>` : ''}
          </div>

          <div class="card-price" style="margin-top: 6px; display: flex; align-items: center; gap: 6px;">
            <label style="font-size: 0.9rem; font-weight: bold; color: #2c3e50;">Venta: $</label>
            <input type="number" 
                   step="0.01" 
                   value="${precioVenta}" 
                   style="width: 100px; padding: 4px 6px; font-weight: bold; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px;"
                   onchange="modificarPrecioVenta('${p.sku}', this.value)" />
          </div>
        </div>

        <div class="card-controls">
          <button class="btn-stock btn-minus" onclick="modificarStock('${p.sku}', -1)">-</button>
          <span class="stock-count ${esCritico ? 'alert' : ''}">${stockActual}</span>
          <button class="btn-stock btn-plus" onclick="modificarStock('${p.sku}', 1)">+</button>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  if (searchInput) searchInput.addEventListener('input', render);
  cargarStock();
</script>
